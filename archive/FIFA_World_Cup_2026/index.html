  <style>
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
    .modal-box { background: var(--surface-solid); border: 1px solid var(--accent); padding: 30px; border-radius: 20px; width: 360px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-top: 5px solid var(--accent); }
    .modal-box h3 { font-size: 1.4rem; font-weight: 800; color: var(--text); margin-bottom: 10px; }
    .modal-box p { font-size: 0.95rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 25px; }
    .modal-actions { display: flex; justify-content: center; gap: 12px; }
    .modal-btn { padding: 10px 24px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.9rem; transition: 0.2s; }
    .modal-btn:hover { transform: scale(1.05); }
    .modal-btn.primary { background: var(--accent); color: white; }
    .modal-btn.secondary { background: var(--surface-alt); color: var(--text-tertiary); }
    .match-stadium { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; font-style: italic; }
  </style>
</head>
<body>

<header class="header">
  <div class="header-row">
    <h1>FIFA World Cup <span>2026</span></h1>
  </div>
  <nav class="tabs">
    <button class="tab active" data-view="schedule">Расписание</button>
    <button class="tab" data-view="groups">Группы</button>
    <button class="tab" data-view="master-table">Таблица</button>
    <button class="tab" data-view="playoff">Плей-офф</button>
    <button class="tab" data-view="stats">Статистика</button>
  </nav>
</header>

<main class="main">
  <div class="view active" id="view-schedule">
    <div class="filter-bar" id="filter-bar"></div>
    <div id="schedule-container"></div>
  </div>
  <div class="view" id="view-groups">
    <div class="groups-grid" id="groups-container"></div>
  </div>
  <div class="view" id="view-master-table">
    <div id="master-table-container"></div>
  </div>
  <div class="view" id="view-playoff">
    <div id="playoff-container"></div>
  </div>
  <div class="view" id="view-stats">
    <div id="stats-container"></div>
  </div>
</main>

<div id="modal-overlay" class="modal-overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal-box">
    <h3 id="modal-title">Подтверждение</h3>
    <p id="modal-msg" style="margin: 15px 0;"></p>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal()">Отмена</button>
      <button class="modal-btn primary" id="confirm-btn">Да, уверен</button>
    </div>
  </div>
</div>
