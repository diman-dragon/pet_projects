[package]
name = "Dorlane-app"
version = "1.0.0"
description = "Dorlane Legal Tech Application"
edition = "2021"

[lib]
name = "Dorlane_app_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
chrono = "0.4"
hex = "0.4"
rand = "0.9"
tauri-plugin-opener = "2.0.0"
tauri-plugin-single-instance = "2.4.1"
sqlite-vec = "0.1"
libsqlite3-sys = "0.30"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
reqwest = { version = "0.12", features = ["blocking", "cookies", "json", "rustls-tls", "stream"] }
futures-util = "0.3"
regex = "1"
zip = "2"
pdf-extract = "0.7"
hmac = "0.12"
argon2 = "0.5"
chacha20poly1305 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
urlencoding = "2.1"
sysinfo = "0.33"
ort = "2.0.0-rc.12"
ndarray = "0.16"
tokenizers = "0.20"
